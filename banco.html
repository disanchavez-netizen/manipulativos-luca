<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    /* ---------- Banco: layout ---------- */
    .workspace { display: flex; flex-direction: column; }
    #canvas { flex: 1; position: relative; overflow: hidden; cursor: default; }
    #canvasHint { position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; color: var(--gray-400); pointer-events: none; transition: opacity 0.4s; }
    #canvasHint .lucide { width: 48px; height: 48px; margin-bottom: 10px; }
    #canvasHint p { font-size: 14px; font-weight: 500; }

    /* Total monetario: superior centrado (la caja ocupa el borde inferior) */
    .money-total { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.95); border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-card); padding: 6px 22px; text-align: center; z-index: 40; transition: opacity .25s; }
    .money-total .label { font-size: 10px; color: var(--gray-500); font-weight: 500; display: block; }
    .money-total .number { font-size: 22px; font-weight: 600; color: var(--primary-600); line-height: 1.15; }
    .money-total.hidden { display: none; }

    /* ---------- Piezas (movimiento libre, sin apilado) ---------- */
    .piece { position: absolute; cursor: grab; user-select: none; touch-action: none; z-index: 20; }
    .piece:active { cursor: grabbing; }
    .piece.flying { transition: left .5s cubic-bezier(.34,1.2,.64,1), top .5s cubic-bezier(.34,1.2,.64,1),
      transform .5s cubic-bezier(.34,1.2,.64,1), opacity .4s; }
    .piece .shape { display: block; filter: drop-shadow(2px 4px 7px rgba(0,0,0,.14)); border-radius: 10px; }
    .piece .shape.coin-shape { border-radius: 50%; }
    .piece.selected .shape { outline: 3px dashed rgba(59,68,208,.65); outline-offset: 3px; }
    .piece.invalid { animation: pShake .45s ease; }
    .piece.invalid .shape { outline-color: var(--danger-600); animation: pRed 1s ease forwards; }
    @keyframes pShake { 0%,100%{translate:0} 20%{translate:-6px 0} 40%{translate:6px 0} 60%{translate:-4px 0} 80%{translate:4px 0} }
    @keyframes pRed { 0%{outline-color:var(--danger-600)} 70%{outline-color:var(--danger-600)} 100%{outline-color:rgba(59,68,208,.65)} }
    .piece.pop { animation: pPop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pPop { from{scale:.4} to{scale:1} }
    .piece svg text { pointer-events: none; }
    /* Radial contextual solo en selección simple */
    .piece.selected > .ctx-radial { display: none; }
    .piece.selected.solo > .ctx-radial { display: block; }

    /* ---------- Cajón de cobro (DS clean, siempre visible) ---------- */
    .caja { position: relative; height: 138px; z-index: 30; flex-shrink: 0;
      background: linear-gradient(180deg, #F4F6F9 0%, #E9ECF2 100%);
      border-top: 1.5px solid #D8DCE5; box-shadow: 0 -4px 14px rgba(17,24,39,.05); }
    .caja::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 64px; height: 5px; border-radius: 999px; background: #CBD1DC; }
    .caja.drop-ready { background: linear-gradient(180deg, #EFFBF9 0%, #E2F5F2 100%); }
    .caja-inner { display: flex; align-items: center; gap: 10px; height: 100%; padding: 14px 16px 10px; overflow-x: auto; }
    .caja-tag { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--gray-500);
      flex-shrink: 0; padding-right: 10px; border-right: 1px solid #DDE1E9; }
    .caja-tag .lucide { width: 20px; height: 20px; }
    .caja-tag span { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; text-align: center; line-height: 1.3; }
    .caja-div { width: 1px; align-self: stretch; background: #DDE1E9; flex-shrink: 0; margin: 4px 2px; }

    .well { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      border: none; border-radius: 10px; background: #DFE3EB; cursor: pointer; flex-shrink: 0; padding: 6px 6px 4px;
      box-shadow: inset 0 2px 6px rgba(17,24,39,.13), inset 0 -1px 0 rgba(255,255,255,.7);
      transition: transform .15s, background .15s, box-shadow .15s; }
    .well:hover { background: #E9EDF4; transform: translateY(-3px); }
    .well:active { transform: scale(.95); }
    .well.w-coin { width: 56px; height: 88px; }
    .well.w-bill { width: 92px; height: 88px; }
    /* Fajo/pila: las capas inferiores desbordan hacia abajo (--poff);
       el margen inferior reserva ese espacio para que la etiqueta numérica
       NUNCA quede debajo de las monedas/billetes. */
    .well .stack { position: relative; pointer-events: none; line-height: 0;
      margin-bottom: calc(var(--poff) * 2 + 3px); }
    .well .stack .layer { display: block; }
    .well .stack .layer.under { position: absolute; left: 0; filter: brightness(.88); }
    .well .stack .layer.u1 { top: var(--poff); }
    .well .stack .layer.u2 { top: calc(var(--poff) * 2); }
    .well .w-label { position: relative; z-index: 1; font-size: 10px; font-weight: 700;
      color: var(--gray-600); pointer-events: none; }
    .well.reject { animation: pShake .45s ease; background: var(--danger-50); }
    .well.receive { animation: wellPulse .5s ease; }
    .well.drop-hover { background: var(--verde-50);
      box-shadow: inset 0 0 0 2px var(--verde), inset 0 2px 6px rgba(17,24,39,.08); }
    @keyframes wellPulse { 0%{background:var(--verde-50);transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }

    /* ---------- Barra de selección ---------- */
    .sel-bar { position: absolute; bottom: 148px; left: 50%; transform: translateX(-50%) translateY(16px);
      opacity: 0; pointer-events: none; background: #fff; border: 1px solid var(--gray-100); border-radius: 999px;
      box-shadow: var(--shadow-float); display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 16px;
      z-index: 60; transition: all .25s cubic-bezier(.34,1.56,.64,1); }
    .sel-bar.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .sel-bar .s-info { font-size: 12px; font-weight: 600; color: var(--gray-700); white-space: nowrap; }
    .sel-bar .s-info b { color: var(--primary-600); }
    .sel-bar button { display: flex; align-items: center; gap: 6px; border: none; border-radius: 999px;
      padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--gray-50); color: var(--gray-700); }
    .sel-bar button .lucide { width: 15px; height: 15px; }
    .sel-bar button:hover { background: var(--gray-100); }
    .sel-bar .b-join { background: var(--primary-600); color: #fff; }
    .sel-bar .b-join:hover { background: var(--primary-700); }
    .sel-bar .b-x { padding: 7px; background: transparent; color: var(--gray-400); }
    .sel-bar.reject { animation: pShake .45s ease; }
    .sel-bar.reject .s-info b { color: var(--danger-600); }

    /* ---------- Popover «Separar en…» ---------- */
    .split-pop { position: absolute; z-index: 1600; background: #fff; border: 1px solid var(--gray-100);
      border-radius: var(--radius); box-shadow: var(--shadow-float); padding: 8px; min-width: 150px;
      animation: popIn .22s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
    .split-pop .sp-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
      color: var(--gray-400); padding: 2px 8px 6px; }
    .split-pop button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: none;
      border-radius: var(--radius-sm); background: transparent; font-size: 13px; font-weight: 600;
      color: var(--gray-700); cursor: pointer; text-align: left; }
    .split-pop button:hover:not(:disabled) { background: var(--primary-50); color: var(--primary-600); }
    .split-pop button:disabled { opacity: .35; cursor: not-allowed; }
    .split-pop .sp-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .split-pop .sp-full { font-size: 10px; color: var(--gray-400); font-weight: 500; margin-left: auto; }

    /* Aviso flotante */
    .money-toast { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); background: var(--gray-900);
      color: #fff; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 999px; z-index: 2001; white-space: nowrap; }
  </style>
</head>
<body>
<div class="brand-chip"><span class="word">Luca</span><span class="dot">.</span></div>

<div class="app">
  <div class="workspace">
    <div id="canvas">
      <div id="canvasHint">
        <i data-lucide="landmark"></i>
        <p>Toca un compartimento del cajón<br>para sacar dinero al lienzo</p>
      </div>
      <div class="money-total" id="totalBar">
        <span class="label">Representación simbólica</span>
        <span class="number" id="totalNumber">$0</span>
      </div>
      <div class="sel-bar" id="selBar"></div>
    </div>
    <div class="caja" id="caja"><div class="caja-inner" id="cajaInner"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="assets/comun.js"></script>
<script>
  /* ============================================================
     BANCO — dinero manipulable con conversiones exactas
     Caja de cobro (única entrada) · lienzo libre · Juntar/Separar
     ============================================================ */

  /* ---------- SVG de piezas (fieles a la referencia) ---------- */
  let _uid = 0;
  function laurel(dark) {
    let g = '<g fill="' + dark + '" opacity=".9">';
    [-1, 1].forEach(function (s) {
      for (let i = 0; i < 5; i++) {
        const deg = 270 + s * (14 + i * 15), rad = deg * Math.PI / 180;
        const x = 50 + 35 * Math.cos(rad), y = 50 - 35 * Math.sin(rad);
        const rot = -deg + (s < 0 ? 90 : -90);
        g += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="6" ry="2.6" transform="rotate(' + rot.toFixed(0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
      }
    });
    return g + '</g>';
  }
  function coinSVG(d, size) {
    const fs = d.label.length > 2 ? 24 : 30;
    return '<svg class="shape coin-shape" width="' + size + '" height="' + size + '" viewBox="0 0 100 100">'
      + '<circle cx="50" cy="50" r="48" fill="' + d.bg + '" stroke="' + d.dark + '" stroke-width="3"/>'
      + '<circle cx="50" cy="50" r="40.5" fill="none" stroke="' + d.dark + '" stroke-width="2.2" stroke-dasharray="1.5 5.5" opacity=".8"/>'
      + '<path d="M22 32 Q36 14 58 16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".38"/>'
      + laurel(d.dark)
      + '<text x="50" y="' + (50 + fs * 0.35) + '" text-anchor="middle" font-family="Poppins,sans-serif" font-size="' + fs + '" font-weight="700" fill="' + d.ink + '">' + d.label + '</text>'
      + '</svg>';
  }
  function dotsG(x, y, cols, rows, fill, r) {
    let g = '<g fill="' + fill + '">';
    for (let c = 0; c < cols; c++) for (let w = 0; w < rows; w++)
      g += '<circle cx="' + (x + c * 7) + '" cy="' + (y + w * 7) + '" r="' + r + '"/>';
    return g + '</g>';
  }
  function cloud(x, y, s) {
    return '<g fill="#FFFFFF" opacity=".85" transform="translate(' + x + ' ' + y + ') scale(' + s + ')">'
      + '<circle cx="0" cy="0" r="7"/><circle cx="8" cy="-3" r="9"/><circle cx="17" cy="0" r="7"/>'
      + '<rect x="-6" y="0" width="29" height="7" rx="3.5"/></g>';
  }
  function sprig(x, y, s, fill, flip) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + (flip ? -s : s) + ' ' + s + ')" fill="' + fill + '">'
      + '<path d="M0 0 Q4 -14 2 -26" fill="none" stroke="' + fill + '" stroke-width="2"/>'
      + '<ellipse cx="-3" cy="-8" rx="4.5" ry="2" transform="rotate(-35 -3 -8)"/>'
      + '<ellipse cx="6" cy="-13" rx="4.5" ry="2" transform="rotate(30 6 -13)"/>'
      + '<ellipse cx="-2" cy="-19" rx="4.5" ry="2" transform="rotate(-30 -2 -19)"/></g>';
  }
  function bust(cx, cy, r, skin, suit, hairPath, extras) {
    return '<g>'
      + '<path d="M' + (cx - r - 7) + ' ' + (cy + r + 16) + ' Q' + cx + ' ' + (cy + r - 8) + ' ' + (cx + r + 7) + ' ' + (cy + r + 16) + ' Z" fill="' + suit + '"/>'
      + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + skin + '"/>'
      + hairPath
      + '<circle cx="' + (cx - r * 0.38) + '" cy="' + (cy + 1) + '" r="1.8" fill="#3B3B3B"/>'
      + '<circle cx="' + (cx + r * 0.38) + '" cy="' + (cy + 1) + '" r="1.8" fill="#3B3B3B"/>'
      + '<path d="M' + (cx - 4) + ' ' + (cy + r * 0.45) + ' Q' + cx + ' ' + (cy + r * 0.45 + 4) + ' ' + (cx + 4) + ' ' + (cy + r * 0.45) + '" fill="none" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round"/>'
      + (extras || '') + '</g>';
  }
  const MOTIFS = {
    20: function () { /* Arco / monumento */
      return '<ellipse cx="118" cy="95" rx="58" ry="7" fill="#8FBF5A" opacity=".4"/>'
        + cloud(56, 30, .8) + cloud(168, 24, .7)
        + '<path d="M86 47 Q118 16 150 47 L150 95 L134 95 L134 66 Q118 52 102 66 L102 95 L86 95 Z" fill="#9A6B44"/>'
        + '<rect x="86" y="42" width="64" height="8" rx="3" fill="#7D5433"/>'
        + '<path d="M110 16 Q118 8 126 16 L122 20 L114 20 Z" fill="#6B4226"/>'
        + '<rect x="82" y="88" width="72" height="7" rx="3" fill="#7D5433"/>'
        + '<circle cx="68" cy="82" r="9" fill="#8FBF5A"/><rect x="66.6" y="88" width="2.8" height="7" fill="#7D5433"/>'
        + '<circle cx="168" cy="84" r="8" fill="#8FBF5A"/><rect x="166.6" y="89" width="2.8" height="6" fill="#7D5433"/>';
    },
    50: function () { /* Ajolote */
      return sprig(70, 96, 1.1, '#3E7CA6') + sprig(178, 98, 1.0, '#3E7CA6', true)
        + '<path d="M150 78 Q172 70 178 56 Q180 74 164 84 Z" fill="#7EC4E8"/>'
        + '<ellipse cx="128" cy="76" rx="32" ry="20" fill="#7EC4E8"/>'
        + '<rect x="108" y="88" width="7" height="10" rx="3.5" fill="#7EC4E8"/><rect x="126" y="90" width="7" height="9" rx="3.5" fill="#7EC4E8"/>'
        + '<g fill="#4E93C4"><ellipse cx="80" cy="42" rx="10" ry="3.6" transform="rotate(-38 80 42)"/><ellipse cx="76" cy="54" rx="11" ry="3.6" transform="rotate(-12 76 54)"/><ellipse cx="79" cy="66" rx="10" ry="3.6" transform="rotate(16 79 66)"/>'
        + '<ellipse cx="126" cy="40" rx="10" ry="3.6" transform="rotate(38 126 40)"/><ellipse cx="131" cy="52" rx="11" ry="3.6" transform="rotate(12 131 52)"/><ellipse cx="128" cy="64" rx="10" ry="3.6" transform="rotate(-16 128 64)"/></g>'
        + '<circle cx="103" cy="56" r="23" fill="#7EC4E8"/>'
        + '<circle cx="94" cy="54" r="2.4" fill="#274B63"/><circle cx="112" cy="54" r="2.4" fill="#274B63"/>'
        + '<path d="M96 63 Q103 69 110 63" fill="none" stroke="#274B63" stroke-width="2" stroke-linecap="round"/>'
        + '<circle cx="89" cy="61" r="3.4" fill="#F09BB8" opacity=".75"/><circle cx="117" cy="61" r="3.4" fill="#F09BB8" opacity=".75"/>';
    },
    100: function () { /* Niña con mariposa */
      return sprig(74, 98, 1.1, '#D98A3C') + sprig(176, 100, 1.0, '#8FBF5A', true)
        + '<g transform="translate(72 34)"><ellipse cx="-6" cy="0" rx="7" ry="4.6" transform="rotate(-28 -6 0)" fill="#E8A23C"/><ellipse cx="6" cy="0" rx="7" ry="4.6" transform="rotate(28 6 0)" fill="#E8A23C"/><rect x="-1.2" y="-5" width="2.4" height="10" rx="1.2" fill="#8A5A3B"/></g>'
        + '<path d="M148 30 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" fill="#F2B33D"/>'
        + '<path d="M96 98 Q122 66 148 98 Z" fill="#E8853D"/>'
        + '<circle cx="122" cy="86" r="5" fill="#FFF6E3"/>'
        + '<circle cx="122" cy="56" r="21" fill="#F6C9A0"/>'
        + '<path d="M99 60 Q98 30 122 30 Q146 30 145 60 Q142 62 140 54 Q138 40 122 40 Q106 40 104 54 Q102 62 99 60 Z" fill="#C4622D"/>'
        + '<circle cx="114" cy="56" r="2.2" fill="#3B3B3B"/><circle cx="130" cy="56" r="2.2" fill="#3B3B3B"/>'
        + '<path d="M117 65 Q122 69 127 65" fill="none" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round"/>'
        + '<circle cx="109" cy="62" r="3.2" fill="#F09BB8" opacity=".7"/><circle cx="135" cy="62" r="3.2" fill="#F09BB8" opacity=".7"/>';
    },
    200: function () { /* Dos personajes */
      return '<ellipse cx="122" cy="98" rx="62" ry="7" fill="#8FBF5A" opacity=".35"/>'
        + sprig(66, 96, 1.0, '#6E9435') + sprig(182, 96, 1.0, '#6E9435', true)
        + bust(102, 58, 16, '#F0C9A2', '#4E5A2A',
            '<path d="M86 58 Q84 36 102 34 Q120 36 118 54 Q112 42 102 42 Q92 42 88 58 Z" fill="#8C8C8C"/>',
            '<circle cx="96" cy="59" r="4.6" fill="none" stroke="#3B3B3B" stroke-width="1.5"/><circle cx="108" cy="59" r="4.6" fill="none" stroke="#3B3B3B" stroke-width="1.5"/><path d="M100.6 59 L103.4 59" stroke="#3B3B3B" stroke-width="1.5"/>'
            + '<path d="M97 76 L102 80 L107 76 L102 73 Z" fill="#FFFFFF"/>')
        + bust(142, 58, 16, '#F0C9A2', '#4E5A2A',
            '<path d="M126 60 Q122 34 142 33 Q162 34 158 60 Q158 46 150 44 Q156 40 146 40 Q134 40 130 48 Q127 52 126 60 Z" fill="#6E6E6E"/>',
            '<path d="M137 76 L142 80 L147 76 L142 73 Z" fill="#FFFFFF"/>');
    },
    500: function () { /* Locomotora + señor de bigote */
      return cloud(60, 26, .75) + cloud(180, 20, .65)
        + '<g><circle cx="70" cy="42" r="5" fill="#FFFFFF" opacity=".8"/><circle cx="77" cy="34" r="4" fill="#FFFFFF" opacity=".7"/><circle cx="83" cy="27" r="3" fill="#FFFFFF" opacity=".6"/>'
        + '<rect x="56" y="62" width="38" height="18" rx="3" fill="#5C4E8E"/>'
        + '<rect x="88" y="48" width="16" height="32" rx="3" fill="#4A3E7E"/>'
        + '<rect x="90.5" y="52" width="11" height="9" rx="2" fill="#C9C0E8"/>'
        + '<rect x="64" y="50" width="8" height="14" rx="2" fill="#4A3E7E"/>'
        + '<rect x="52" y="78" width="56" height="4" rx="2" fill="#3E3266"/>'
        + '<circle cx="66" cy="86" r="6" fill="#3E3266"/><circle cx="82" cy="86" r="6" fill="#3E3266"/><circle cx="98" cy="86" r="6" fill="#3E3266"/>'
        + '<circle cx="66" cy="86" r="2" fill="#C9C0E8"/><circle cx="82" cy="86" r="2" fill="#C9C0E8"/><circle cx="98" cy="86" r="2" fill="#C9C0E8"/></g>'
        + '<g><path d="M128 96 Q152 74 176 96 Z" fill="#4A3E7E"/>'
        + '<path d="M147 88 L152 93 L157 88 L152 84 Z" fill="#FFFFFF"/>'
        + '<circle cx="152" cy="58" r="20" fill="#F0C9A2"/>'
        + '<path d="M132 60 Q130 36 152 34 Q174 36 172 60 Q170 46 160 42 Q166 38 152 38 Q140 38 136 48 Q133 52 132 60 Z" fill="#3E3266"/>'
        + '<circle cx="145" cy="58" r="2.2" fill="#3B3B3B"/><circle cx="159" cy="58" r="2.2" fill="#3B3B3B"/>'
        + '<path d="M152 66 Q143 61 137 67 Q144 72 152 68 Q160 72 167 67 Q161 61 152 66 Z" fill="#3E3266"/></g>';
    },
    1000: function () { /* Familia */
      return '<path d="M196 92 Q214 70 208 44 Q222 68 210 94 Z" fill="#3A9E9B" opacity=".5"/>'
        + sprig(196, 98, 1.15, '#2E8582', true)
        + bust(96, 60, 15, '#EAD9C4', '#2E7B78',
            '<path d="M81 62 Q79 38 96 36 Q113 38 111 62 Q109 50 104 46 Q108 58 96 44 Q88 46 85 54 Q82 58 81 62 Z" fill="#20514F"/>', '')
        + bust(126, 58, 15, '#EAD9C4', '#3A8E8B',
            '<path d="M111 56 Q111 36 126 35 Q141 36 141 56 Q138 44 126 42 Q114 44 111 56 Z" fill="#1D4C4A"/>', '')
        + bust(158, 60, 16, '#EAD9C4', '#20716E',
            '<path d="M142 58 Q141 36 158 35 Q175 36 174 58 Q171 44 158 42 Q145 44 142 58 Z" fill="#173B39"/>'
            + '<path d="M146 64 Q147 78 158 78 Q169 78 170 64 Q166 70 158 70 Q150 70 146 64 Z" fill="#173B39"/>',
            '<path d="M155 78 L158 92 L161 78 Z" fill="#12312F"/>');
    }
  };
  function billSVG(d, w) {
    const h = Math.round(w * 110 / 240), id = 'bc' + (++_uid);
    return '<svg class="shape" width="' + w + '" height="' + h + '" viewBox="0 0 240 110">'
      + '<defs><clipPath id="' + id + '"><rect x="1.5" y="1.5" width="237" height="107" rx="10"/></clipPath></defs>'
      + '<rect x="1.5" y="1.5" width="237" height="107" rx="10" fill="' + d.bg + '" stroke="' + d.band + '" stroke-width="3"/>'
      + '<g clip-path="url(#' + id + ')">'
      + '<path d="M150 110 C168 66 206 74 240 42 L240 110 Z" fill="' + d.mid + '" opacity=".5"/>'
      + '<path d="M34 0 C70 26 52 58 88 110 L34 110 Z" fill="' + d.mid + '" opacity=".35"/>'
      + MOTIFS[d.motif]()
      + '<rect x="0" y="0" width="34" height="110" fill="' + d.band + '"/>'
      + dotsG(11, 12, 2, 3, 'rgba(255,255,255,.85)', 1.7)
      + dotsG(11, 80, 2, 3, 'rgba(255,255,255,.85)', 1.7)
      + '<text x="17" y="55" transform="rotate(-90 17 55)" text-anchor="middle" dominant-baseline="central" font-family="Poppins,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">' + d.label + '</text>'
      + '</g>'
      + '<text x="228" y="28" text-anchor="end" font-family="Poppins,sans-serif" font-size="24" font-weight="700" fill="' + d.txt + '">' + d.label + '</text>'
      + dotsG(206, 92, 4, 2, d.txt, 1.6)
      + '</svg>';
  }
  function shapeHTML(d, scale) {
    scale = scale || 1;
    return d.type === 'coin' ? coinSVG(d, Math.round(d.size * scale)) : billSVG(d, Math.round(122 * scale));
  }

  /* ---------- Denominaciones (valores en centavos: sin flotantes) ---------- */
  const DENOMS = [
    { v: 50,     label: '50¢',   type: 'coin', size: 46, bg: '#E8853D', dark: '#B5601F', ink: '#7D3F0E' },
    { v: 100,    label: '$1',    type: 'coin', size: 48, bg: '#F2B33D', dark: '#C08A16', ink: '#7A5200' },
    { v: 200,    label: '$2',    type: 'coin', size: 50, bg: '#A9713D', dark: '#7D4E24', ink: '#4E2E12' },
    { v: 500,    label: '$5',    type: 'coin', size: 52, bg: '#A8B43C', dark: '#7A8428', ink: '#4C5316' },
    { v: 1000,   label: '$10',   type: 'coin', size: 56, bg: '#B8BDC7', dark: '#8A8F99', ink: '#4B5563' },
    { v: 2000,   label: '$20',   type: 'bill', motif: 20,   bg: '#FBE3DC', band: '#E5736F', mid: '#F6B9AE', txt: '#B03A34' },
    { v: 5000,   label: '$50',   type: 'bill', motif: 50,   bg: '#E0EFF8', band: '#4A90C4', mid: '#AFD4EC', txt: '#1F5B8A' },
    { v: 10000,  label: '$100',  type: 'bill', motif: 100,  bg: '#FCEEDA', band: '#E8953D', mid: '#F5CD9A', txt: '#B5601F' },
    { v: 20000,  label: '$200',  type: 'bill', motif: 200,  bg: '#EDF4DC', band: '#7BA43C', mid: '#C4DB96', txt: '#55772A' },
    { v: 50000,  label: '$500',  type: 'bill', motif: 500,  bg: '#ECE8F6', band: '#6B5CA5', mid: '#C4B9E2', txt: '#4A3E7E' },
    { v: 100000, label: '$1000', type: 'bill', motif: 1000, bg: '#DFF2F1', band: '#3A9E9B', mid: '#A5D8D6', txt: '#20716E' },
  ];
  const byVal = v => DENOMS.find(d => d.v === v);
  const DEN_SET = new Set(DENOMS.map(d => d.v));
  const MAX = 40;
  const TAP_DIST = 12, TAP_MS = 300;   /* tolerancia táctil */

  function fmt(cents) {
    const frac = cents % 100 !== 0;
    return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: frac ? 2 : 0 });
  }
  function pieceDims(d) { return d.type === 'coin' ? { w: d.size, h: d.size } : { w: 122, h: 56 }; }

  const app = {
    canvas: null, caja: null, selBar: null, totalBar: null, canvasHint: null,
    pieces: [], zi: 20, pop: null,

    init() {
      this.canvas = document.getElementById('canvas');
      this.caja = document.getElementById('caja');
      this.selBar = document.getElementById('selBar');
      this.totalBar = document.getElementById('totalBar');
      this.canvasHint = document.getElementById('canvasHint');

      this.buildCaja();

      Luca.text.init(this.canvas, { onSelectionChange: () => this.clearSelection(false) });
      Luca.fab.init({
        vista: () => this.totalBar.classList.toggle('hidden'),
        vistaTip: 'Ver / ocultar total',
        capture: () => Luca.capturar(this.canvas, 'banco-luca'),
        reset: () => this.clearCanvas(),
        resetTip: 'Reiniciar lienzo',
        isPiece: (t) => !!t.closest('.piece'),
        cardTitle: 'Banco',
        /* Sin bloque particular: la caja de cobro es la única vía de entrada */
        getCtx: () => {
          const sel = this.selected();
          if (!sel.length) return null;
          if (sel.length === 1) {
            const items = [];
            if (this.splitOptions(sel[0].v).length) items.push({ icon: 'split', tip: 'Separar en…', action: 'split' });
            items.push({ icon: 'archive', tip: 'Guardar en caja', action: 'save' });
            return { title: 'Selección', items, run: (a) => this.runSel(a) };
          }
          const sum = sel.reduce((a, p) => a + p.v, 0);
          return {
            title: 'Selección',
            items: [
              { icon: 'merge', tip: 'Juntar (' + fmt(sum) + ')', action: 'join' },
              { icon: 'archive', tip: 'Guardar en caja (' + sel.length + ')', action: 'save' },
            ],
            run: (a) => this.runSel(a)
          };
        }
      });

      /* Lienzo vacío: toque simple deselecciona; arrastrar no tiene efecto */
      let tapEmpty = null;
      this.canvas.addEventListener('pointerdown', (e) => {
        if (e.target !== this.canvas && e.target !== this.canvasHint) return;
        tapEmpty = { x: e.clientX, y: e.clientY };
      });
      this.canvas.addEventListener('pointerup', (e) => {
        if (!tapEmpty) return;
        if (Math.hypot(e.clientX - tapEmpty.x, e.clientY - tapEmpty.y) < TAP_DIST) this.clearSelection();
        tapEmpty = null;
      });
      document.addEventListener('pointerdown', (e) => {
        if (this.pop && !e.target.closest('.split-pop') && !e.target.closest('.ctx-node')
          && !e.target.closest('.tool-card') && !e.target.closest('.sel-bar')) this.closePop();
      });
      window.addEventListener('resize', () => this.pieces.forEach(p => this.clampInside(p)));
    },

    runSel(a) {
      const sel = this.selected();
      if (a === 'join') this.tryJoin();
      if (a === 'split' && sel[0]) this.openSplitPop(sel[0]);
      if (a === 'save') this.saveSelected();
    },

    /* ---------- Cajón de cobro ---------- */
    buildCaja() {
      const inner = document.getElementById('cajaInner');
      const wellHTML = (d) => {
        const isCoin = d.type === 'coin';
        const off = isCoin ? 3 : 4;                    /* desborde de la pila hacia abajo */
        const mini = shapeHTML(d, isCoin ? 0.62 : 0.6);
        return '<button class="well ' + (isCoin ? 'w-coin' : 'w-bill') + '" data-v="' + d.v + '"'
          + ' style="--poff:' + off + 'px" aria-label="Sacar ' + d.label + '">'
          + '<span class="stack">'
          + '<span class="layer under u2">' + mini + '</span>'
          + '<span class="layer under u1">' + mini + '</span>'
          + '<span class="layer">' + mini + '</span>'
          + '</span><span class="w-label">' + d.label + '</span></button>';
      };
      inner.innerHTML =
        '<div class="caja-tag"><i data-lucide="inbox"></i><span>Caja de<br>cobro</span></div>'
        + DENOMS.filter(d => d.type === 'coin').map(wellHTML).join('')
        + '<div class="caja-div"></div>'
        + DENOMS.filter(d => d.type === 'bill').map(wellHTML).join('');
      inner.querySelectorAll('.well').forEach(b => {
        b.addEventListener('click', () => {
          const d = byVal(+b.dataset.v);
          if (this.pieces.length >= MAX) {
            b.classList.remove('reject'); void b.offsetWidth; b.classList.add('reject');
            this.toast('Lienzo lleno (' + MAX + ' piezas)');
            return;
          }
          this.spawnCenter(d, b.getBoundingClientRect());
        });
      });
      Luca.icons();
    },
    wellOf(v) { return this.caja.querySelector('.well[data-v="' + v + '"]'); },

    /* ---------- Piezas ---------- */
    bounds() {
      return { left: 6, top: 6, right: this.canvas.clientWidth - 6, bottom: this.canvas.clientHeight - 6 };
    },
    clampInside(p) {
      const b = this.bounds();
      const x = Math.min(Math.max(p.el.offsetLeft, b.left), Math.max(b.left, b.right - p.w));
      const y = Math.min(Math.max(p.el.offsetTop, b.top), Math.max(b.top, b.bottom - p.h));
      p.el.style.left = x + 'px'; p.el.style.top = y + 'px';
    },
    spawnCenter(d, fromRect) {
      const b = this.bounds();
      const cx = (b.left + b.right) / 2 + (Math.random() * 140 - 70);
      const cy = (b.top + b.bottom) / 2 + (Math.random() * 100 - 50);
      return this.createPiece(d, cx, cy, fromRect);
    },
    createPiece(d, cx, cy, fromRect, preselect) {
      const el = document.createElement('div');
      el.className = 'piece';
      el.innerHTML = shapeHTML(d);
      const dim = pieceDims(d);
      const b = this.bounds();
      const x = Math.min(Math.max(cx - dim.w / 2, b.left), Math.max(b.left, b.right - dim.w));
      const y = Math.min(Math.max(cy - dim.h / 2, b.top), Math.max(b.top, b.bottom - dim.h));
      el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = this.zi++;
      const piece = { el, v: d.v, w: dim.w, h: dim.h };

      const menu = Luca.ctxRadial(this.ctxItems(d));
      menu.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn || btn.dataset.lp) return;
        e.stopPropagation();
        if (btn.dataset.action === 'split') this.openSplitPop(piece);
        if (btn.dataset.action === 'save') { piece.el.classList.add('selected'); this.saveSelected(); }
      });
      el.appendChild(menu);

      this.canvas.appendChild(el);
      this.pieces.push(piece);
      this.attachPointer(piece);
      if (preselect) el.classList.add('selected');
      if (fromRect) this.flyIn(el, fromRect);
      else { el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 450); }
      Luca.icons();
      this.refresh();
      return piece;
    },
    ctxItems(d) {
      const items = [];
      if (this.splitOptions(d.v).length) items.push({ icon: 'split', tip: 'Separar en…', action: 'split' });
      items.push({ icon: 'archive', tip: 'Guardar en caja', action: 'save' });
      return items;
    },
    flyIn(el, fromRect) {
      const to = el.getBoundingClientRect();
      const dx = fromRect.left + fromRect.width / 2 - (to.left + to.width / 2);
      const dy = fromRect.top + fromRect.height / 2 - (to.top + to.height / 2);
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.35)';
      el.style.opacity = '.4';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transition = 'transform .5s cubic-bezier(.34,1.2,.64,1),opacity .4s';
        el.style.transform = ''; el.style.opacity = '';
        setTimeout(() => { el.style.transition = ''; }, 520);
      }));
    },
    flyOutToCaja(piece, done) {
      const well = this.wellOf(piece.v);
      const from = piece.el.getBoundingClientRect(), to = well.getBoundingClientRect();
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      piece.el.classList.add('flying');
      piece.el.style.zIndex = 800;
      piece.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.3)';
      piece.el.style.opacity = '0';
      well.classList.remove('receive'); void well.offsetWidth; well.classList.add('receive');
      setTimeout(() => { piece.el.remove(); done && done(); }, 480);
    },

    /* ---------- Selección + arrastre (tolerancia táctil 12px/300ms) ---------- */
    selected() { return this.pieces.filter(p => p.el.classList.contains('selected')); },
    clearSelection(refreshText) {
      this.pieces.forEach(p => p.el.classList.remove('selected', 'solo'));
      if (refreshText !== false) Luca.text.deselect();
      this.closePop();
      this.refresh();
    },
    attachPointer(piece) {
      const el = piece.el, self = this;
      let sx, sy, t0, moved, group, starts, overCaja;
      el.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.ctx-node')) return;
        e.stopPropagation();
        Luca.text.deselect();
        sx = e.clientX; sy = e.clientY; t0 = Date.now(); moved = false; overCaja = false;
        el.style.zIndex = self.zi++;
        group = el.classList.contains('selected') ? self.selected() : [piece];
        starts = group.map(p => ({ p, x: p.el.offsetLeft, y: p.el.offsetTop }));
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
      });
      el.addEventListener('pointermove', (e) => {
        if (sx === undefined) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < TAP_DIST) return;
        moved = true; self.closePop();
        const b = self.bounds();
        starts.forEach(s => {
          const nx = Math.min(Math.max(s.x + dx, b.left), Math.max(b.left, b.right - s.p.w));
          const ny = Math.min(Math.max(s.y + dy, b.top), Math.max(b.top, b.bottom - s.p.h));
          s.p.el.style.left = nx + 'px'; s.p.el.style.top = ny + 'px';
        });
        const cajaTop = self.caja.getBoundingClientRect().top;
        const nowOver = e.clientY >= cajaTop;
        if (nowOver !== overCaja) {
          overCaja = nowOver;
          self.caja.classList.toggle('drop-ready', overCaja);
          group.forEach(p => { const w = self.wellOf(p.v); w && w.classList.toggle('drop-hover', overCaja); });
        }
      });
      el.addEventListener('pointerup', (e) => {
        if (sx === undefined) return;
        self.caja.classList.remove('drop-ready');
        self.caja.querySelectorAll('.well.drop-hover').forEach(w => w.classList.remove('drop-hover'));
        const dist = Math.hypot(e.clientX - sx, e.clientY - sy);
        const isTap = !moved || (Date.now() - t0 < TAP_MS && dist < TAP_DIST);
        if (isTap) {
          if (moved) starts.forEach(s => { s.p.el.style.left = s.x + 'px'; s.p.el.style.top = s.y + 'px'; });
          el.classList.toggle('selected');                 /* toque acumulativo */
          self.refresh();
        } else if (overCaja) {
          group.forEach(p => p.el.classList.add('selected'));
          self.saveSelected();
        } else {
          group.forEach(p => p.el.classList.add('selected'));  /* lo que arrastras queda seleccionado */
          self.refresh();
        }
        sx = undefined;
      });
    },

    /* ---------- Juntar ---------- */
    tryJoin() {
      const sel = this.selected();
      if (sel.length < 2) return;
      const sum = sel.reduce((a, p) => a + p.v, 0);
      if (!DEN_SET.has(sum)) {
        sel.forEach(p => { p.el.classList.remove('invalid'); void p.el.offsetWidth; p.el.classList.add('invalid'); });
        this.selBar.classList.remove('reject'); void this.selBar.offsetWidth; this.selBar.classList.add('reject');
        this.toast(fmt(sum) + ' no equivale a una denominación');
        return;
      }
      const first = sel[0];
      const cx = first.el.offsetLeft + first.w / 2, cy = first.el.offsetTop + first.h / 2;
      sel.forEach(p => {
        p.el.classList.add('flying');
        p.el.style.zIndex = 700;
        p.el.style.left = (cx - p.w / 2) + 'px'; p.el.style.top = (cy - p.h / 2) + 'px';
        if (p !== first) { p.el.style.opacity = '0'; p.el.style.transform = 'scale(.4)'; }
      });
      setTimeout(() => {
        sel.forEach(p => { p.el.remove(); this.pieces.splice(this.pieces.indexOf(p), 1); });
        this.createPiece(byVal(sum), cx, cy, null, true);   /* queda seleccionada: radial listo */
      }, 460);
    },

    /* ---------- Separar ---------- */
    splitOptions(v) {
      return DENOMS.filter(d => d.v < v && v % d.v === 0 && v / d.v >= 2 && v / d.v <= MAX)
                   .map(d => ({ d, count: v / d.v })).reverse();
    },
    closePop() { if (this.pop) { this.pop.remove(); this.pop = null; } },
    openSplitPop(piece) {
      this.closePop();
      const opts = this.splitOptions(piece.v);
      if (!opts.length) return;
      const free = MAX - this.pieces.length + 1;   /* la pieza se reemplaza a sí misma */
      const pop = document.createElement('div');
      pop.className = 'split-pop';
      pop.innerHTML = '<div class="sp-title">Separar ' + byVal(piece.v).label + ' en…</div>' + opts.map((o, i) =>
        '<button data-i="' + i + '" ' + (o.count > free ? 'disabled' : '') + '>'
        + '<span class="sp-dot" style="background:' + (o.d.band || o.d.bg) + '"></span>'
        + o.count + ' × ' + o.d.label + (o.count > free ? '<span class="sp-full">sin espacio</span>' : '')
        + '</button>').join('');
      this.canvas.appendChild(pop);
      this.pop = pop;
      let px = piece.el.offsetLeft + piece.w + 8, py = piece.el.offsetTop - 6;
      if (px + 170 > this.canvas.clientWidth) px = Math.max(6, piece.el.offsetLeft - 166);
      py = Math.max(8, Math.min(py, this.canvas.clientHeight - pop.offsetHeight - 12));
      pop.style.left = px + 'px'; pop.style.top = py + 'px';
      pop.querySelectorAll('button:not(:disabled)').forEach(b => {
        b.addEventListener('click', () => { const o = opts[+b.dataset.i]; this.closePop(); this.doSplit(piece, o); });
      });
    },
    doSplit(piece, opt) {
      const cx = piece.el.offsetLeft + piece.w / 2, cy = piece.el.offsetTop + piece.h / 2;
      const originRect = piece.el.getBoundingClientRect();
      piece.el.remove(); this.pieces.splice(this.pieces.indexOf(piece), 1);
      const dim = pieceDims(opt.d), step = Math.max(dim.w, dim.h) + 14;
      for (let i = 0; i < opt.count; i++) {
        let x = cx, y = cy;
        if (i > 0) { /* espiral áurea alrededor del origen */
          const a = i * 2.39996, r = step * .62 * Math.sqrt(i);
          x = cx + r * Math.cos(a); y = cy + r * Math.sin(a);
        }
        this.createPiece(opt.d, x, y, originRect, true);    /* grupo queda seleccionado */
      }
      this.refresh();
    },

    /* ---------- Guardar en caja ---------- */
    saveSelected() {
      const sel = this.selected();
      sel.forEach((p, i) => {
        this.pieces.splice(this.pieces.indexOf(p), 1);
        setTimeout(() => this.flyOutToCaja(p, i === sel.length - 1 ? () => this.refresh() : null), i * 70);
      });
      setTimeout(() => this.refresh(), 80);
    },

    /* ---------- Barra de selección + total ---------- */
    refresh() {
      const sel = this.selected();
      this.pieces.forEach(p => p.el.classList.toggle('solo', sel.length === 1 && sel[0] === p));
      if (sel.length) {
        const sum = sel.reduce((a, p) => a + p.v, 0);
        let btns = '';
        if (sel.length >= 2) btns += '<button class="b-join" data-a="join"><i data-lucide="merge"></i>Juntar</button>';
        else if (this.splitOptions(sel[0].v).length) btns += '<button data-a="split"><i data-lucide="split"></i>Separar</button>';
        btns += '<button data-a="save"><i data-lucide="archive"></i>Guardar</button>';
        if (sel.length < this.pieces.length)
          btns += '<button data-a="all"><i data-lucide="list-checks"></i>Seleccionar todo</button>';
        btns += '<button class="b-x" data-a="clear" aria-label="Quitar selección"><i data-lucide="x"></i></button>';
        this.selBar.innerHTML = '<span class="s-info">' + sel.length + ' pieza' + (sel.length > 1 ? 's' : '') + ' · <b>' + fmt(sum) + '</b></span>' + btns;
        this.selBar.classList.add('on');
        this.selBar.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
          const a = b.dataset.a;
          if (a === 'all') { this.pieces.forEach(p => p.el.classList.add('selected')); this.refresh(); }
          else if (a === 'clear') this.clearSelection();
          else this.runSel(a);
        }));
        Luca.icons();
      } else {
        this.selBar.classList.remove('on');
      }
      const total = this.pieces.reduce((a, p) => a + p.v, 0);
      document.getElementById('totalNumber').textContent = fmt(total);
      if (this.canvasHint) this.canvasHint.style.opacity = this.pieces.length ? 0 : 1;
      Luca.fab.refreshCard();
    },

    toast(msg) {
      const m = document.createElement('div');
      m.className = 'money-toast';
      m.textContent = msg;
      this.canvas.appendChild(m);
      setTimeout(() => m.remove(), 1600);
    },

    clearCanvas() {
      this.pieces.forEach(p => p.el.remove());
      this.pieces = [];
      this.closePop();
      Luca.text.clear();
      this.refresh();
    }
  };

  window.addEventListener('DOMContentLoaded', () => app.init());
</script>
  <script>
    /* User Guide (coach marks) — se abre desde el nodo «?» del radial */
    window.addEventListener('DOMContentLoaded', function () {
      Luca.guide.init('banco', [
        { el: '#caja', title: 'Caja de cobro', text: 'Es la vía de entrada del dinero: teclea una cantidad para generar sus monedas y billetes.' },
        { el: '#canvas', title: 'El lienzo', text: 'Selecciona monedas y billetes para juntarlos o separarlos en denominaciones equivalentes.' },
      ].concat(Luca.guide.commonSteps()));
    });
  </script>
</body>
