<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    /* Total con fracción apilada */
    .total-frac { font-size: 34px; font-weight: 600; color: var(--primary-600); line-height: 1; display: flex; align-items: center; }
    .total-num-wrap { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .total-frac-stack { display: inline-flex; flex-direction: column; align-items: center; }
    .total-frac-stack .fn, .total-frac-stack .fd { font-size: 24px; font-weight: 600; color: var(--primary-600); line-height: 1.15; }
    .total-frac-stack .fbar { width: 100%; min-width: 20px; border-top: 3px solid var(--primary-600); }
    .total-dec { font-size: 16px; font-weight: 600; color: var(--gray-500); }

    /* Grupos de piezas */
    .group-container { position: absolute; touch-action: none; user-select: none; cursor: grab; }
    .group-container:active { cursor: grabbing; }
    .piece-svg { position: absolute; left: 0; top: 0; pointer-events: none; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    .group-hitbox { border-radius: 50%; position: absolute; }
    .group-container.selected .group-hitbox { outline: 3px dashed rgba(59, 68, 208, 0.6); border-radius: 50%; }

    .snap-guide { position: absolute; border-radius: 50%; pointer-events: none; z-index: 500; border: 2.5px dashed rgba(59, 68, 208, 0.4); display: none; }
    @keyframes ringPop {
      0% { transform: translate(-50%,-50%) scale(0.6); opacity: 1; }
      60% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1.4); opacity: 0; }
    }
    .celebrate-ring  { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3000; border: 5px solid var(--verde); animation: ringPop 0.6s ease-out forwards; }
    .celebrate-ring2 { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3000; border: 3px solid var(--amarillo); animation: ringPop 0.7s 0.08s ease-out forwards; }

    .denom-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 2px 6px 6px; }
    .denom-btn { padding: 7px 2px; border-radius: var(--radius-sm); border: 1.5px solid; background: #fff;
      font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: transform .15s; }
    .denom-btn:hover { transform: scale(1.07); }

    #canvasHint {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; color: var(--gray-400); pointer-events: none; transition: opacity 0.4s;
    }
    #canvasHint .lucide { width: 48px; height: 48px; margin-bottom: 10px; }
    #canvasHint p { font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
<div class="brand-chip"><span class="word">Luca</span><span class="dot">.</span></div>

<div class="app">
  <div class="workspace">
    <div id="canvas">
      <div id="canvasHint">
        <i data-lucide="pie-chart"></i>
        <p>Abre el menú L. → ⋯ y elige una fracción<br>para agregarla al lienzo</p>
      </div>
      <div class="snap-guide" id="snapGuide"></div>
    </div>

    <div class="total-bar" id="totalBar">
      <div>
        <span class="label">Valor total representado</span>
        <div class="total-num-wrap">
          <div class="total-frac" id="totalFrac">0</div>
          <div class="total-dec" id="totalDec">= 0</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="assets/comun.js"></script>
<script>
  const DENOM_COLORS = {
    1:  { h: '#3B44D0', l: '#B8BDEE', d: '#2E36A8' },
    2:  { h: '#FF8283', l: '#FFCFCF', d: '#C94F50' },
    3:  { h: '#FFBA31', l: '#FFE099', d: '#C88A00' },
    4:  { h: '#32C8BD', l: '#9DE8E3', d: '#1A9990' },
    5:  { h: '#9B59B6', l: '#D5ACE8', d: '#6C3483' },
    6:  { h: '#E67E22', l: '#F5C97A', d: '#B05A0D' },
    7:  { h: '#27AE60', l: '#A9DFC0', d: '#1A7A43' },
    8:  { h: '#E74C3C', l: '#F4A69F', d: '#922B21' },
    9:  { h: '#16A085', l: '#87E0D0', d: '#0E8A70' },
    10: { h: '#2980B9', l: '#98CCF0', d: '#1A6096' }
  };

  const DISC_R = 96, PAD = 8, SIZE = (DISC_R + PAD) * 2, SNAP_R = DISC_R * 1.6;

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function simplify(n, d) { if (n === 0) return [0, 1]; const g = gcd(Math.abs(n), d); return [n / g, d / g]; }

  function createSVGNode(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (let k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function buildSectorDOM(denom, startAngle, color, showLabel) {
    const cx = DISC_R + PAD, cy = DISC_R + PAD, r = DISC_R;
    const svg = createSVGNode('svg', { width: SIZE, height: SIZE, viewBox: `0 0 ${SIZE} ${SIZE}` });

    if (denom === 1) {
      svg.appendChild(createSVGNode('circle', { cx, cy, r, fill: color.h, stroke: color.d, 'stroke-width': 2.5 }));
      if (showLabel) {
        const txt = createSVGNode('text', {
          x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
          'font-family': 'Poppins,sans-serif', 'font-size': '22', 'font-weight': '700', fill: 'white'
        });
        txt.textContent = '1';
        svg.appendChild(txt);
      }
      return svg;
    }

    const angle = (2 * Math.PI) / denom, sa = startAngle, ea = sa + angle;
    const x1 = cx + r * Math.cos(sa), y1 = cy + r * Math.sin(sa);
    const x2 = cx + r * Math.cos(ea), y2 = cy + r * Math.sin(ea);
    const large = angle > Math.PI ? 1 : 0;

    svg.appendChild(createSVGNode('path', {
      d: `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z`,
      fill: color.h, stroke: color.d, 'stroke-width': 2, 'stroke-linejoin': 'round'
    }));

    if (showLabel) {
      const midA = sa + angle / 2, tr = r * (denom <= 3 ? 0.55 : denom <= 6 ? 0.62 : 0.68);
      const tx = cx + tr * Math.cos(midA), ty = cy + tr * Math.sin(midA);
      const fs = denom <= 4 ? 15 : denom <= 7 ? 13 : 11;
      const txt = createSVGNode('text', {
        x: tx, y: ty, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': 'Poppins,sans-serif', 'font-size': fs, 'font-weight': '700', fill: 'white'
      });
      txt.textContent = `1/${denom}`;
      svg.appendChild(txt);
    }
    return svg;
  }

  const app = {
    canvas: null, totalBar: null, snapGuide: null, canvasHint: null,
    groups: [], selected: null, dragging: false, dragGroup: null,
    offsetX: 0, offsetY: 0, zIdx: 10,
    showLabels: true,   /* La vista unificada inicia visible: etiquetas + total */

    init() {
      this.canvas = document.getElementById('canvas');
      this.totalBar = document.getElementById('totalBar');
      this.snapGuide = document.getElementById('snapGuide');
      this.canvasHint = document.getElementById('canvasHint');

      Luca.text.init(this.canvas, { onSelectionChange: () => this.deselect() });
      Luca.fab.init({
        vista: () => this.toggleVista(),
        vistaTip: 'Ver / ocultar etiquetas y total',
        capture: () => Luca.capturar(this.canvas, 'fracciones-luca'),
        reset: () => this.clearCanvas(),
        resetTip: 'Reiniciar lienzo',
        isPiece: (t) => !!t.closest('.group-container'),
        /* Grid 1…1/10: un clic agrega UNA pieza (misma lógica que Cubo) */
        buildPart: (el) => {
          const g = document.createElement('div'); g.className = 'denom-grid';
          for (let d = 1; d <= 10; d++) {
            const c = DENOM_COLORS[d];
            const b = document.createElement('button');
            b.className = 'denom-btn';
            b.style.borderColor = c.h; b.style.color = c.h;
            b.textContent = d === 1 ? '1' : '1/' + d;
            b.title = d === 1 ? 'Agregar entero (1)' : 'Agregar fracción 1/' + d;
            b.addEventListener('click', () => this.addPieces(d));
            g.appendChild(b);
          }
          el.appendChild(g);
        },
        getCtx: () => this.selected ? {
          title: 'Pieza seleccionada',
          items: [
            { icon: 'arrow-up-to-line', tip: 'Traer al frente', action: 'front' },
            { icon: 'x',                tip: 'Eliminar',        action: 'delete', danger: true },
          ],
          run: (a) => {
            if (a === 'front') this.bringFront(this.selected);
            else if (a === 'delete') this.deleteGroup(this.selected);
          }
        } : null
      });

      window.addEventListener('pointermove', e => this.onMove(e));
      window.addEventListener('pointerup', e => this.onUp(e));
      document.addEventListener('pointerdown', e => {
        if (!e.target.closest('.group-container') && !e.target.closest('.fab-root')) this.deselect();
      });
    },

    /* Vista unificada: etiquetas + barra de total como un solo estado */
    toggleVista() {
      this.showLabels = !this.showLabels;
      this.totalBar.classList.toggle('hidden', !this.showLabels);
      this.groups.forEach(g => this.renderGroup(g));
    },

    addPieces(denom) {
      if (this.canvasHint) this.canvasHint.style.opacity = '0';
      const cw = this.canvas.offsetWidth || window.innerWidth || 800;
      const ch = this.canvas.offsetHeight || window.innerHeight || 600;
      const offset = (this.groups.length % 6) * 16;
      this.spawnGroup(denom, cw / 2 + offset, ch / 2 - 40 + offset);
      this.updateTotal();
    },

    spawnGroup(denom, cx, cy) {
      const el = document.createElement('div');
      el.className = 'group-container';
      el.style.left = (cx - DISC_R - PAD) + 'px';
      el.style.top = (cy - DISC_R - PAD) + 'px';
      el.style.width = SIZE + 'px';
      el.style.height = SIZE + 'px';
      el.style.zIndex = this.zIdx++;

      const hitbox = document.createElement('div');
      hitbox.className = 'group-hitbox';
      hitbox.style.cssText = `width:${SIZE}px;height:${SIZE}px;left:0;top:0;`;
      el.appendChild(hitbox);

      const menu = Luca.ctxRadial([
        { action: 'front',  icon: 'arrow-up-to-line', tip: 'Traer al frente' },
        { action: 'delete', icon: 'x',                tip: 'Eliminar', danger: true }
      ]);
      menu.style.left = '50%'; menu.style.top = '8px';
      menu.addEventListener('click', e => {
        const btn = e.target.closest('[data-action]');
        if (!btn || btn.dataset.lp) return;
        if (btn.dataset.action === 'front') this.bringFront(grp);
        if (btn.dataset.action === 'delete') this.deleteGroup(grp);
      });
      el.appendChild(menu);

      const grp = { el, pieces: [{ denom, startAngle: -Math.PI / 2 }], cx, cy };
      this.renderGroup(grp);

      el.addEventListener('pointerdown', e => {
        if (e.target.closest('.ctx-radial')) return;
        e.preventDefault();
        this.selectGroup(grp);
        this.dragging = true; this.dragGroup = grp;
        const r = el.getBoundingClientRect();
        this.offsetX = e.clientX - r.left - SIZE / 2;
        this.offsetY = e.clientY - r.top - SIZE / 2;
        el.setPointerCapture(e.pointerId);
      });

      this.canvas.appendChild(el);
      this.groups.push(grp);
      Luca.icons();
      return grp;
    },

    renderGroup(grp) {
      grp.el.querySelectorAll('.piece-svg').forEach(p => p.remove());
      grp.pieces.forEach(p => {
        const wrap = document.createElement('div');
        wrap.className = 'piece-svg';
        wrap.style.cssText = `position:absolute;left:0;top:0;width:${SIZE}px;height:${SIZE}px;`;
        wrap.appendChild(buildSectorDOM(p.denom, p.startAngle, DENOM_COLORS[p.denom], this.showLabels));
        grp.el.appendChild(wrap);
      });
    },

    selectGroup(grp) {
      Luca.text.deselect();
      this.deselect();
      this.selected = grp;
      grp.el.classList.add('selected');
      grp.el.style.zIndex = this.zIdx++;
      Luca.fab.refreshCard();
    },

    deselect() {
      if (this.selected) { this.selected.el.classList.remove('selected'); this.selected = null; Luca.fab.refreshCard(); }
    },

    bringFront(grp) { grp.el.style.zIndex = this.zIdx++; },

    deleteGroup(grp) {
      grp.el.remove();
      this.groups = this.groups.filter(g => g !== grp);
      if (this.selected === grp) this.selected = null;
      if (this.groups.length === 0 && this.canvasHint) this.canvasHint.style.opacity = '1';
      this.updateTotal();
      Luca.fab.refreshCard();
    },

    onMove(e) {
      if (!this.dragging || !this.dragGroup) return;
      e.preventDefault();
      const cr = this.canvas.getBoundingClientRect();
      const nx = e.clientX - cr.left - this.offsetX - SIZE / 2;
      const ny = e.clientY - cr.top - this.offsetY - SIZE / 2;
      this.dragGroup.el.style.left = nx + 'px';
      this.dragGroup.el.style.top = ny + 'px';
      this.dragGroup.cx = nx + DISC_R + PAD;
      this.dragGroup.cy = ny + DISC_R + PAD;

      const target = this.findSnapTarget(this.dragGroup);
      if (target) {
        this.snapGuide.style.cssText = `display:block;left:${target.cx - DISC_R - PAD}px;top:${target.cy - DISC_R - PAD}px;width:${SIZE}px;height:${SIZE}px;`;
      } else {
        this.snapGuide.style.display = 'none';
      }
    },

    onUp() {
      if (!this.dragging) return;
      this.dragging = false;
      this.snapGuide.style.display = 'none';
      if (this.dragGroup) this.tryMerge(this.dragGroup);
      this.dragGroup = null;
    },

    findSnapTarget(moving) {
      let best = null, bestD = SNAP_R;
      this.groups.forEach(g => {
        if (g === moving) return;
        const d = Math.hypot(moving.cx - g.cx, moving.cy - g.cy);
        if (d < bestD) { bestD = d; best = g; }
      });
      return best;
    },

    tryMerge(moving) {
      const target = this.findSnapTarget(moving);
      if (!target) { this.updateTotal(); return; }

      const allPieces = [...target.pieces, ...moving.pieces];
      let num = 0, den = 1;
      allPieces.forEach(p => {
        const [n, d] = simplify(1, p.denom);
        num = num * d + n * den;
        den = den * d;
        const g = gcd(Math.abs(num), den); num /= g; den /= g;
      });

      let angle = -Math.PI / 2;
      target.pieces = allPieces.map(p => {
        const sa = angle;
        angle += (2 * Math.PI) / p.denom;
        return { denom: p.denom, startAngle: sa };
      });

      target.el.style.left = (target.cx - DISC_R - PAD) + 'px';
      target.el.style.top = (target.cy - DISC_R - PAD) + 'px';
      this.renderGroup(target);

      moving.el.remove();
      this.groups = this.groups.filter(g => g !== moving);
      if (this.selected === moving) this.selected = null;
      this.selectGroup(target);

      if (num === den) this.celebrate(target);
      this.updateTotal();
    },

    celebrate(grp) {
      const cx = grp.cx, cy = grp.cy;
      const r1 = DISC_R + 10, r2 = DISC_R + 24;

      const ring1 = document.createElement('div');
      ring1.className = 'celebrate-ring';
      ring1.style.cssText = `left:${cx}px;top:${cy}px;width:${r1 * 2}px;height:${r1 * 2}px;margin-left:${-r1}px;margin-top:${-r1}px;`;
      this.canvas.appendChild(ring1);

      const ring2 = document.createElement('div');
      ring2.className = 'celebrate-ring2';
      ring2.style.cssText = `left:${cx}px;top:${cy}px;width:${r2 * 2}px;height:${r2 * 2}px;margin-left:${-r2}px;margin-top:${-r2}px;`;
      this.canvas.appendChild(ring2);

      const colors = [DENOM_COLORS[2].h, DENOM_COLORS[3].h, DENOM_COLORS[4].h, DENOM_COLORS[5].h, '#fff'];
      for (let i = 0; i < 10; i++) {
        const dot = document.createElement('div');
        const angle = (i / 10) * Math.PI * 2;
        const dist = DISC_R + 30 + Math.random() * 30;
        const tx = cx + Math.cos(angle) * dist, ty = cy + Math.sin(angle) * dist;
        dot.style.cssText = `position:absolute;width:8px;height:8px;border-radius:50%;
          background:${colors[i % colors.length]};pointer-events:none;z-index:3001;
          left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);
          transition:left 0.5s ease-out,top 0.5s ease-out,opacity 0.5s ease-out;`;
        this.canvas.appendChild(dot);
        requestAnimationFrame(() => {
          dot.style.left = tx + 'px'; dot.style.top = ty + 'px'; dot.style.opacity = '0';
        });
        setTimeout(() => dot.remove(), 600);
      }
      setTimeout(() => { ring1.remove(); ring2.remove(); }, 800);
    },

    updateTotal() {
      let num = 0, den = 1;
      this.groups.forEach(grp => {
        grp.pieces.forEach(p => {
          num = num * p.denom + den;
          den = den * p.denom;
          const g = gcd(Math.abs(num), den); num /= g; den /= g;
        });
      });

      const fracEl = document.getElementById('totalFrac');
      const decEl = document.getElementById('totalDec');

      if (num === 0) {
        fracEl.textContent = '0';
        decEl.textContent = '= 0';
      } else if (den === 1) {
        fracEl.textContent = num;
        decEl.textContent = `= ${num}.0`;
      } else {
        fracEl.innerHTML = `<span class="total-frac-stack"><span class="fn">${num}</span><span class="fbar"></span><span class="fd">${den}</span></span>`;
        const v = num / den;
        const vStr = v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
        decEl.textContent = '= ' + (Number.isInteger(v) ? v : vStr);
      }
    },

    clearCanvas() {
      this.groups.forEach(g => g.el.remove());
      this.groups = []; this.selected = null;
      Luca.text.clear();
      if (this.canvasHint) this.canvasHint.style.opacity = '1';
      this.updateTotal();
      Luca.fab.refreshCard();
    }
  };

  window.addEventListener('DOMContentLoaded', () => app.init());
</script>
  <script>
    /* User Guide (coach marks) — se abre desde el nodo «?» del radial */
    window.addEventListener('DOMContentLoaded', function () {
      Luca.guide.init('fracciones', [
        { el: '#canvas', title: 'El lienzo', text: 'Arrastra una pieza sobre otra del mismo denominador para juntarlas: forman grupos y enteros.' },
        { el: '#totalBar', title: 'Total', text: 'La suma de todas las fracciones del lienzo. Se muestra u oculta desde «Vista».', optional: true },
        { el: '.fab2 [data-id=\'tool\']', title: 'Agregar fracciones', text: 'Abre «⋯ Acciones» y toca una fracción (1 a 1/10) para agregarla al lienzo.', before: () => Luca.fab.setOpen(true) },
      ].concat(Luca.guide.commonSteps()));
    });
  </script>
</body>
</html>
