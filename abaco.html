<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    #canvas { display: flex; align-items: center; justify-content: center; padding: 32px; }
    .abaco-wrapper {
      width: 100%; max-width: 420px; aspect-ratio: 1 / 1.618;
      display: flex; align-items: center; justify-content: center;
      transform-origin: 50% 43.4%; transition: transform 0.4s ease-in-out;
    }
    #abacoRotator { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #abacoSVG { width: 100%; height: 100%; display: block; }
    .bead { cursor: grab; }
  </style>
</head>
<body>
<div class="brand-chip"><span class="word">Luca</span><span class="dot">.</span></div>

<div class="app">
  <div class="workspace">
    <div id="canvas">
      <div class="abaco-wrapper">
        <div id="abacoRotator">
          <svg viewBox="0 0 700 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="abacoSVG">
            <defs>
              <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#3B44D0;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#5456E5;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#6B7CF0;stop-opacity:1" />
              </linearGradient>
            </defs>
            <g id="rods">
              <rect x="72" y="50"  width="556" height="18" fill="#FCE14B"/>
              <rect x="72" y="200" width="556" height="18" fill="#FCE14B"/>
              <rect x="72" y="350" width="556" height="18" fill="#FCE14B"/>
              <rect x="72" y="500" width="556" height="18" fill="#FCE14B"/>
              <rect x="72" y="650" width="556" height="18" fill="#FCE14B"/>
              <rect x="72" y="800" width="556" height="18" fill="#FCE14B"/>
            </g>
            <g id="columns">
              <rect x="40" y="30" width="32" height="800" fill="url(#blueGradient)" rx="2"/>
              <polygon points="72,30 80,22 80,822 72,830" fill="#2E36A8" opacity="0.7"/>
              <polygon points="40,30 72,30 80,22 48,22" fill="#8B9AF5" opacity="0.5"/>
              <rect x="628" y="30" width="32" height="800" fill="url(#blueGradient)" rx="2"/>
              <polygon points="660,30 668,22 668,822 660,830" fill="#2E36A8" opacity="0.7"/>
              <polygon points="628,30 660,30 668,22 636,22" fill="#8B9AF5" opacity="0.5"/>
            </g>
            <g id="beads"></g>
          </svg>
        </div>
      </div>
    </div>

    <div class="total-bar" id="totalBar">
      <div>
        <span class="label">Representación simbólica</span>
        <span class="number" id="totalNumber">0</span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="assets/comun.js"></script>
<script>
  const app = {
    svg: null, beadsGroup: null, totalBar: null, totalNumber: null,

    rows: [
      { name: 'Unidades',        value: 1,      color: '#ED7245', y: 809 },
      { name: 'Decenas',         value: 10,     color: '#F8BBD0', y: 659 },
      { name: 'Centenas',        value: 100,    color: '#54C45E', y: 509 },
      { name: 'Millares',        value: 1000,   color: '#ED7245', y: 359 },
      { name: 'Decenas de mil',  value: 10000,  color: '#3D68B3', y: 209 },
      { name: 'Centenas de mil', value: 100000, color: '#E5554F', y: 59  }
    ],

    beads: [], isDragging: false, draggedBead: null,
    dragStartX: 0, dragStartCX: 0, isClick: false, currentRotation: 0,

    init() {
      this.svg = document.getElementById('abacoSVG');
      this.beadsGroup = document.getElementById('beads');
      this.totalBar = document.getElementById('totalBar');
      this.totalNumber = document.getElementById('totalNumber');
      this.buildBeads();
      window.addEventListener('pointermove', (e) => this.handlePointerMove(e));
      window.addEventListener('pointerup', () => this.handlePointerUp());

      const canvas = document.getElementById('canvas');
      Luca.text.init(canvas);
      Luca.fab.init({
        vista: () => this.toggleTotal(),
        vistaTip: 'Ver / ocultar total',
        capture: () => Luca.capturar(canvas, 'abaco-luca'),   /* lienzo completo: ábaco + textos */
        reset: () => { this.resetAbaco(); Luca.text.clear(); },
        resetTip: 'Reiniciar ábaco',
        buildPart: (el) => {
          const b = document.createElement('button');
          b.className = 'tc-item';
          b.innerHTML = '<span class="chip-ic ic-indigo"><i data-lucide="rotate-cw"></i></span>Rotar ábaco 90°';
          b.addEventListener('click', () => this.rotateAbaco());
          el.appendChild(b);
        },
        getCtx: () => null   /* el Ábaco no tiene piezas; los textos aportan su propia sección */
      });
    },

    buildBeads() {
      const NS = 'http://www.w3.org/2000/svg';
      this.beads = [];
      this.rows.forEach((row, rowIndex) => {
        for (let i = 0; i < 10; i++) {
          const cx = 86 + i * 27;
          const el = document.createElementNS(NS, 'ellipse');
          el.setAttribute('class', 'bead');
          el.setAttribute('cx', cx); el.setAttribute('cy', row.y);
          el.setAttribute('rx', 12); el.setAttribute('ry', 22);
          el.setAttribute('fill', row.color);
          el.addEventListener('pointerdown', (e) => this.handleBeadDown(e, el));
          this.beadsGroup.appendChild(el);
          this.beads.push({ element: el, rowIndex, beadIndex: i, value: row.value, initialCX: cx, originalCX: cx });
        }
      });
    },

    handleBeadDown(e, beadElement) {
      if (this.isDragging) return;
      const bead = this.beads.find(b => b.element === beadElement);
      if (!bead) return;
      this.isDragging = true; this.draggedBead = bead;
      this.dragStartX = e.clientX; this.dragStartCX = parseFloat(bead.element.getAttribute('cx'));
      this.isClick = true; beadElement.style.transition = 'none';
    },

    handlePointerMove(e) {
      if (!this.isDragging || !this.draggedBead) return;
      const svgRect = this.svg.getBoundingClientRect();
      const deltaX = e.clientX - this.dragStartX;
      if (Math.abs(deltaX) > 5) this.isClick = false;
      const newCX = Math.max(86, Math.min(616, this.dragStartCX + (deltaX * (700 / svgRect.width))));
      this.draggedBead.element.setAttribute('cx', newCX);
    },

    handlePointerUp() {
      if (this.isDragging && this.draggedBead) {
        const bead = this.draggedBead;
        const currentCX = parseFloat(bead.element.getAttribute('cx'));
        let targetCX = bead.originalCX;
        const rowBeads = this.beads.filter(b => b.rowIndex === bead.rowIndex).sort((a, b) => a.beadIndex - b.beadIndex);

        const moveRight = () => {
          targetCX = 616;
          const beadsToRight = rowBeads.filter(b => b.beadIndex > bead.beadIndex);
          if (beadsToRight.length > 0) targetCX = Math.min(targetCX, parseFloat(beadsToRight[0].element.getAttribute('cx')) - 27);
        };
        const moveLeft = () => {
          targetCX = 86;
          const beadsToLeft = rowBeads.filter(b => b.beadIndex < bead.beadIndex);
          if (beadsToLeft.length > 0) targetCX = Math.max(targetCX, parseFloat(beadsToLeft[beadsToLeft.length - 1].element.getAttribute('cx')) + 27);
        };

        if (this.isClick) {
          const activeCuentas = rowBeads.filter(b => parseFloat(b.element.getAttribute('cx')) > 350);
          (activeCuentas.length === 0 || currentCX <= 350) ? moveRight() : moveLeft();
        } else {
          (currentCX > this.dragStartCX) ? moveRight() : moveLeft();
        }

        bead.element.style.transition = 'cx 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
        bead.element.setAttribute('cx', targetCX);
        bead.initialCX = targetCX;
        setTimeout(() => { bead.element.style.transition = 'none'; }, 350);
        this.updateTotal();
      }
      this.isDragging = false; this.draggedBead = null; this.isClick = false;
    },

    rotateAbaco() {
      const wrapper = document.querySelector('.abaco-wrapper');
      this.currentRotation = (this.currentRotation + 90) % 360;
      wrapper.style.transform = `rotate(${this.currentRotation}deg)`;
    },

    resetAbaco() {
      this.beads.forEach(bead => {
        bead.element.style.transition = 'cx 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
        bead.element.setAttribute('cx', bead.originalCX);
        bead.initialCX = bead.originalCX;
      });
      setTimeout(() => this.beads.forEach(b => b.element.style.transition = 'none'), 350);
      this.updateTotal();
    },

    updateTotal() {
      let total = 0;
      this.beads.forEach(bead => {
        if (parseFloat(bead.element.getAttribute('cx')) > 350) total += bead.value;
      });
      this.totalNumber.textContent = total;
    },

    toggleTotal() { this.totalBar.classList.toggle('hidden'); }
  };

  window.addEventListener('DOMContentLoaded', () => app.init());
</script>
  <script>
    /* User Guide (coach marks) — se abre desde el nodo «?» del radial */
    window.addEventListener('DOMContentLoaded', function () {
      Luca.guide.init('abaco', [
        { el: '#canvas', title: 'El ábaco', text: 'Toca o arrastra las cuentas para activarlas. Cada fila representa un valor posicional: unidades, decenas, centenas…' },
        { el: '#totalBar', title: 'Total', text: 'Aquí se forma el número que representan las cuentas activas. Puedes mostrarlo u ocultarlo desde «Vista».', optional: true },
        { el: '.fab2 [data-id=\'tool\']', title: 'Acciones del ábaco', text: 'Desde «⋯ Acciones» puedes rotar el ábaco 90°.', before: () => Luca.fab.setOpen(true) },
      ].concat(Luca.guide.commonSteps()));
    });
  </script>
</body>
</html>
